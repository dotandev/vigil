[workspace]
members = ["contracts/vigil", "contracts/mock-pool"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dotandev/vigil"

[workspace.dependencies]
near-sdk = "5.30.1"
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
